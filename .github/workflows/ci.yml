# Independent verification of anvilkit-agent-api from this repository alone:
# build, vet, test and the race check of the transport with GOWORK=off, the
# image from the repository root, and the chart's lint and render.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
env:
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.0"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./internal/transport/...
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t anvilkit-agent-api:ci .
  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "v3.19.0"
      - run: helm lint deploy/chart --set control.address=control:9101 --set auth.principalsSecret.name=principals --set identity.trustDomain=ci.example --set identity.certificate.issuerRef.name=ci-issuer --set auth.oidc.issuer=https://issuer.ci.example
      - run: helm template anvilkit-agent-api deploy/chart --set control.address=control:9101 --set auth.principalsSecret.name=principals --set identity.trustDomain=ci.example --set identity.certificate.issuerRef.name=ci-issuer --set auth.oidc.issuer=https://issuer.ci.example > /dev/null
