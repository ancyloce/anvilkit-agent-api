# Chart values of anvilkit-agent-api. Only what this service needs: its image,
# its reviewed configuration file, the allowlisted placement overrides, probes
# and resources. Environment values (addresses, replica counts, the principals
# Secret name, the pinned image digest) are supplied by the deploying
# repository per environment; secrets never enter this chart.

image:
  repository: anvilkit-agent-api
  # tag defaults to the chart's appVersion; digest, when set, pins the exact
  # image (repository@sha256:...) and takes precedence over the tag.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 2

# HorizontalPodAutoscaler (autoscaling/v2). Off unless the environment enables
# it with an explicit maxReplicas: the maximum is bounded by downstream caps
# and the database connection budget (deploy/gitops/lock.yaml), never a chart
# default. While enabled the Deployment leaves replicas to the autoscaler.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 0
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: ""
  # The API needs no Kubernetes API access.
  automountServiceAccountToken: false

# The listener inside the Pod (ANVILKIT_API_LISTEN); the Service targets its port.
listen:
  address: 0.0.0.0
  port: 9100

# The Control gRPC endpoint (ANVILKIT_API_CONTROL_ADDRESS); required.
# serverName is the DNS SAN Control's certificate must carry under mtls
# (default its service name).
control:
  address: ""
  serverName: anvilkit-agent-control

# The Knowledge and MCP owners' gRPC endpoints (ANVILKIT_API_KNOWLEDGE_ADDRESS,
# ANVILKIT_API_MCP_ADDRESS); empty leaves their endpoints answering
# DEPENDENCY_UNAVAILABLE. serverName as for control.
knowledge:
  address: ""
  serverName: anvilkit-agent-knowledge
mcp:
  address: ""
  serverName: anvilkit-agent-mcp

# The API's workload identity (P0.1): the certificate its three gRPC
# clients present (Control, Knowledge, MCP) and verify their peers
# against. The certificate is a cert-manager Certificate this chart renders
# (certificate.create) from issuerRef, or an existing Secret (secretName,
# keys tls.crt, tls.key, ca.crt) when create is false; the files are mounted
# at /etc/anvilkit/identity and reloaded as a whole. mode development
# renders plaintext clients and only with development.enabled: true.
identity:
  mode: mtls
  trustDomain: ""
  secretName: ""
  certificate:
    create: true
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    duration: 2160h
    renewBefore: 720h

# The top-level DEVELOPMENT_ONLY guard: every development transport
# (identity.mode, telemetry.otlpTls.mode) renders only while this is true;
# it downgrades nothing by itself.
development:
  enabled: false

# The identity protocol (ANVILKIT_API_AUTH_MODE). Only the DEVELOPMENT_ONLY
# "fixture" mode exists until ENV-07 supplies the IdP inputs; it reads the
# principals file from an existing Secret that this chart never creates.
auth:
  mode: fixture
  principalsSecret:
    name: ""
    key: principals.json

# The reviewed, secret-free configuration file (services/agent/api config.yaml
# sections): rendered into a ConfigMap and mounted at ANVILKIT_API_CONFIG.
# Placement values above override it through the allowlisted environment.
config:
  http:
    listen: 127.0.0.1:9100
    read_header_timeout: 10s
    body_limit_bytes: 262144
    shutdown_timeout: 20s
  control:
    address: 127.0.0.1:9101
  auth:
    mode: fixture
  sse:
    heartbeat_interval: 15s
    frame_buffer: 64
    slow_consumer_grace: 5s
    write_timeout: 10s

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# /healthz answers while the process runs; /readyz answers while new work can
# be admitted (the readiness hook of the bootstrap).
probes:
  startup:
    periodSeconds: 2
    failureThreshold: 30
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3

# Shutdown: Fx stops the listener with http.shutdown_timeout from the
# configuration; the grace period must exceed it.
terminationGracePeriodSeconds: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints: []
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# Telemetry placement (P23): the collector's OTLP endpoint for spans
# (ANVILKIT_API_TELEMETRY_OTLP_ENDPOINT) and the port of its own metrics listener
# (ANVILKIT_API_TELEMETRY_METRICS_LISTEN, never the service port); empty disables it.
# Scraping is the environment's pod annotations.
telemetry:
  otlpEndpoint: ""
  metricsPort: 0
  # The collector transport while otlpEndpoint is set: tls verifies the
  # collector against caSecret (key ca.crt) and serverName, mtls also presents
  # the workload certificate, development is plaintext (development.enabled).
  otlpTls:
    mode: tls
    serverName: ""
    caSecret:
      name: ""
      key: ca.crt
